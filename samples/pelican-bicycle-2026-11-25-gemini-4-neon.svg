<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑自行车</title>
  <desc id="desc">一只白色鹈鹕在晴朗的海滨公路上骑着红色复古自行车，翅膀握着车把，橙色蹼足踩着脚踏板。</desc>

  <defs>
    <!-- Sky & Scenery Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ecae6"/>
      <stop offset="55%" stop-color="#cde9f6"/>
      <stop offset="100%" stop-color="#fff4e0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9db" stop-opacity="1"/>
      <stop offset="45%" stop-color="#ffe066" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fa8d3"/>
      <stop offset="100%" stop-color="#3b82a6"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Pelican Gradients -->
    <linearGradient id="bodyGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8f5ee"/>
      <stop offset="100%" stop-color="#e4ddd0"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f1ece1"/>
      <stop offset="100%" stop-color="#dcd4c4"/>
    </linearGradient>
    <linearGradient id="beakTopGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#f9c74f"/>
      <stop offset="60%" stop-color="#f8961e"/>
      <stop offset="100%" stop-color="#f3722c"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffbe76"/>
      <stop offset="55%" stop-color="#f69454"/>
      <stop offset="100%" stop-color="#e06d3b"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d96704"/>
    </linearGradient>

    <!-- Bike Gradients -->
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a5b32"/>
      <stop offset="100%" stop-color="#5c3317"/>
    </linearGradient>

    <!-- Reusable Bicycle Wheel -->
    <g id="wheel">
      <!-- Spokes (12) -->
      <g stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round">
        <line x1="0" y1="-66" x2="0" y2="66"/>
        <line x1="-66" y1="0" x2="66" y2="0"/>
        <line x1="-46.7" y1="-46.7" x2="46.7" y2="46.7"/>
        <line x1="-46.7" y1="46.7" x2="46.7" y2="-46.7"/>
        <line x1="-33" y1="-57.2" x2="33" y2="57.2"/>
        <line x1="-57.2" y1="-33" x2="57.2" y2="33"/>
        <line x1="-57.2" y1="33" x2="57.2" y2="-33"/>
        <line x1="-33" y1="57.2" x2="33" y2="-57.2"/>
      </g>
      <!-- Outer Rubber Tire -->
      <circle cx="0" cy="0" r="71" fill="none" stroke="#1e293b" stroke-width="11"/>
      <!-- Tire Sidewall Cream Accent -->
      <circle cx="0" cy="0" r="65.5" fill="none" stroke="#e2d9c8" stroke-width="2"/>
      <!-- Metallic Rim -->
      <circle cx="0" cy="0" r="62.5" fill="none" stroke="#94a3b8" stroke-width="3.5"/>
      <circle cx="0" cy="0" r="61" fill="none" stroke="#f1f5f9" stroke-width="1"/>
      <!-- Center Hub -->
      <circle cx="0" cy="0" r="9.5" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#e2e8f0"/>
    </g>
  </defs>

  <!-- ==================== 1. BACKGROUND SCENE ==================== -->
  <rect width="800" height="560" fill="url(#skyGrad)"/>

  <!-- Warm Sun -->
  <circle cx="675" cy="95" r="78" fill="url(#sunGlow)"/>
  <circle cx="675" cy="95" r="32" fill="#fff3b0"/>

  <!-- Soft Clouds -->
  <g fill="#ffffff" opacity="0.82">
    <path d="M 85 118 C 85 102, 106 94, 120 102 C 128 86, 158 84, 168 100 C 184 98, 198 108, 196 122 C 196 128, 188 132, 178 132 L 100 132 C 90 132, 85 126, 85 118 Z"/>
    <path d="M 520 82 C 520 71, 535 66, 545 71 C 552 59, 574 58, 581 70 C 592 69, 602 76, 600 86 C 600 90, 594 93, 586 93 L 532 93 C 524 93, 520 88, 520 82 Z"/>
    <path d="M 275 152 C 275 144, 286 140, 294 144 C 299 135, 316 135, 321 144 C 330 143, 338 148, 336 156 L 283 156 C 277 156, 275 154, 275 152 Z" opacity="0.65"/>
  </g>

  <!-- Distant Seagulls -->
  <g fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" opacity="0.55">
    <path d="M 195 155 Q 204 147 212 156 Q 220 147 229 155"/>
    <path d="M 238 138 Q 244 132 250 139 Q 256 132 262 138"/>
    <path d="M 610 154 Q 617 148 624 155 Q 631 148 638 154"/>
  </g>

  <!-- Distant Sea & Coastal Hills -->
  <rect x="0" y="348" width="800" height="58" fill="url(#seaGrad)"/>
  <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.35">
    <line x1="65" y1="366" x2="135" y2="366"/>
    <line x1="470" y1="362" x2="540" y2="362"/>
    <line x1="650" y1="378" x2="735" y2="378"/>
    <line x1="110" y1="386" x2="170" y2="386"/>
  </g>
  <!-- Far Headland -->
  <path d="M 0 352 Q 95 318 195 338 Q 260 350 325 352 Z" fill="#7aa6a1" opacity="0.8"/>
  <path d="M 590 352 Q 685 322 800 338 L 800 352 Z" fill="#7aa6a1" opacity="0.8"/>

  <!-- Roadside Promenade / Curb & Asphalt -->
  <rect x="0" y="402" width="800" height="16" fill="#e9dcc9"/>
  <rect x="0" y="418" width="800" height="6" fill="#cbd5e1"/>
  <rect x="0" y="424" width="800" height="136" fill="url(#roadGrad)"/>
  <!-- Dashed Road Line -->
  <line x1="0" y1="496" x2="800" y2="496" stroke="#f8fafc" stroke-width="5" stroke-dasharray="36 28" opacity="0.72"/>

  <!-- Subtle Breeze Lines (Sense of Motion) -->
  <g fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.65">
    <path d="M 92 225 Q 130 222 162 225"/>
    <path d="M 118 242 Q 148 240 176 242"/>
    <path d="M 75 338 Q 112 336 144 338"/>
  </g>

  <!-- Ground Contact Shadow -->
  <ellipse cx="406" cy="474" rx="228" ry="13" fill="#1e293b" opacity="0.28"/>
  <ellipse cx="245" cy="472" rx="48" ry="6" fill="#0f172a" opacity="0.24"/>
  <ellipse cx="565" cy="472" rx="48" ry="6" fill="#0f172a" opacity="0.24"/>

  <!-- ==================== 2. FAR-SIDE PELICAN & BIKE PARTS ==================== -->
  <!-- Far Wing (Reaching to far handlebar grip) -->
  <path d="M 378 196 C 412 184, 444 190, 474 202 C 479 205, 478 214, 470 214 C 446 214, 418 220, 384 224 Z"
        fill="#e6dfd2" stroke="#948979" stroke-width="2" stroke-linejoin="round"/>
  <!-- Far Wing Primary Tips -->
  <path d="M 442 194 C 458 194, 472 198, 476 205 C 474 212, 462 214, 448 212 Z" fill="#475569"/>

  <!-- Far Crank & Pedal (Upper-Left Position) -->
  <line x1="380" y1="400" x2="354" y2="362" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
  <rect x="339" y="357" width="30" height="8" rx="3" fill="#334155"/>

  <!-- Far Leg & Webbed Foot (Behind Frame) -->
  <g>
    <path d="M 332 270 L 348 318 L 352 356" fill="none" stroke="#c96a12" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 332 270 L 348 318 L 352 356" fill="none" stroke="#e58926" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Far Webbed Foot -->
    <path d="M 343 356 C 350 350, 366 350, 376 358 C 368 361, 353 362, 341 360 Z" fill="#d97706" stroke="#9a4406" stroke-width="1.6" stroke-linejoin="round"/>
  </g>

  <!-- ==================== 3. BICYCLE ==================== -->
  <!-- Wheels -->
  <use href="#wheel" x="245" y="395"/>
  <use href="#wheel" x="565" y="395"/>

  <!-- Fenders / Mudguards -->
  <path d="M 171 384 A 76 76 0 0 1 304 344" fill="none" stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 498 355 A 76 76 0 0 1 638 378" fill="none" stroke="url(#frameGrad)" stroke-width="7" stroke-linecap="round"/>
  <!-- Fender Stays -->
  <line x1="245" y1="395" x2="177" y2="375" stroke="#94a3b8" stroke-width="2"/>
  <line x1="565" y1="395" x2="633" y2="372" stroke="#94a3b8" stroke-width="2"/>

  <!-- Rear Carrier Rack -->
  <g stroke="#475569" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 186 306 L 320 306"/>
    <path d="M 245 395 L 204 306"/>
    <path d="M 320 306 L 333 296"/>
  </g>

  <!-- Bicycle Chain & Rear Cog -->
  <g>
    <!-- Chain Loops -->
    <line x1="245" y1="384" x2="380" y2="376" stroke="#334155" stroke-width="3.5" stroke-dasharray="5 2"/>
    <line x1="245" y1="406" x2="380" y2="424" stroke="#334155" stroke-width="3.5" stroke-dasharray="5 2"/>
    <!-- Rear Cog -->
    <circle cx="245" cy="395" r="11" fill="#475569" stroke="#1e293b" stroke-width="2"/>
    <circle cx="245" cy="395" r="4" fill="#cbd5e1"/>
  </g>

  <!-- Main Bicycle Frame -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Chainstay & Seatstay -->
    <line x1="245" y1="395" x2="380" y2="400" stroke="url(#frameGrad)" stroke-width="7"/>
    <line x1="245" y1="395" x2="336" y2="286" stroke="url(#frameGrad)" stroke-width="6.5"/>
    <!-- Main Triangle -->
    <line x1="380" y1="400" x2="336" y2="286" stroke="url(#frameGrad)" stroke-width="9"/>
    <line x1="380" y1="400" x2="508" y2="284" stroke="url(#frameGrad)" stroke-width="9.5"/>
    <line x1="336" y1="286" x2="498" y2="254" stroke="url(#frameGrad)" stroke-width="8.5"/>
    <!-- Head Tube -->
    <line x1="495" y1="246" x2="511" y2="292" stroke="#991b1b" stroke-width="11"/>
    <!-- Front Fork -->
    <path d="M 510 290 Q 530 342 565 395" stroke="url(#frameGrad)" stroke-width="8"/>
    <!-- Subtle Frame Highlights -->
    <line x1="340" y1="284" x2="494" y2="252" stroke="#fca5a5" stroke-width="1.8" opacity="0.7"/>
    <line x1="384" y1="394" x2="504" y2="285" stroke="#fca5a5" stroke-width="1.8" opacity="0.65"/>
  </g>

  <!-- Headlight on Fork Crown -->
  <g>
    <path d="M 515 292 L 534 288" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 532 280 C 544 278, 550 282, 550 289 C 550 296, 544 299, 532 297 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.8"/>
    <ellipse cx="550" cy="288.5" rx="3" ry="8" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
  </g>

  <!-- Seatpost & Leather Saddle -->
  <line x1="336" y1="286" x2="328" y2="262" stroke="url(#chromeGrad)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 294 258 C 304 252, 336 254, 355 259 C 361 261, 360 268, 352 269 C 335 270, 304 271, 294 265 C 290 263, 290 260, 294 258 Z"
        fill="url(#leatherGrad)" stroke="#3e200d" stroke-width="1.8"/>
  <!-- Saddle Springs -->
  <path d="M 304 269 Q 302 275 308 276 M 313 269 Q 311 275 317 276" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

  <!-- Stem, Handlebars & Bell -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Quill Stem -->
    <path d="M 495 246 L 486 215" stroke="url(#chromeGrad)" stroke-width="6.5"/>
    <!-- Far Handlebar -->
    <path d="M 486 215 Q 484 205 470 205" stroke="#94a3b8" stroke-width="5.5"/>
    <path d="M 476 205 L 465 206" stroke="#5c3317" stroke-width="7.5"/>
    <!-- Near Handlebar Swept Back -->
    <path d="M 486 215 Q 474 224 446 226" stroke="url(#chromeGrad)" stroke-width="6"/>
    <!-- Near Leather Grip -->
    <path d="M 462 224 L 443 226" stroke="url(#leatherGrad)" stroke-width="9"/>
  </g>
  <!-- Brass Bell -->
  <path d="M 472 214 A 7 7 0 0 1 486 214 Z" fill="#f59e0b" stroke="#92400e" stroke-width="1.4"/>
  <circle cx="479" cy="206" r="1.5" fill="#92400e"/>

  <!-- Front Chainring -->
  <g transform="translate(380, 400)">
    <circle cx="0" cy="0" r="24" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="7" fill="#64748b"/>
  </g>

  <!-- ==================== 4. PELICAN (MAIN BODY, HEAD, BEAK) ==================== -->
  <!-- Tail Feathers -->
  <path d="M 272 230 C 242 224, 218 232, 206 244 C 220 248, 232 248, 244 246 C 228 254, 216 260, 214 268 C 236 268, 260 264, 282 256 Z"
        fill="#f1ece1" stroke="#948979" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 206 244 C 218 242, 234 242, 250 244" fill="none" stroke="#948979" stroke-width="1.4"/>

  <!-- Main Plump Body & S-Curved Neck -->
  <path d="M 262 238
           C 266 196, 305 178, 348 184
           C 364 186, 376 176, 384 152
           C 390 132, 396 105, 422 96
           C 444 90, 460 105, 456 124
           C 452 138, 434 146, 422 162
           C 412 176, 412 198, 410 222
           C 408 262, 378 286, 332 284
           C 292 282, 259 266, 262 238 Z"
        fill="url(#bodyGrad)" stroke="#8c8273" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Soft Belly & Chest Contour Shading -->
  <path d="M 274 256 C 302 276, 354 278, 388 256 C 372 278, 322 284, 282 268 Z" fill="#dcd4c4" opacity="0.7"/>

  <!-- Head Crest Feathers -->
  <path d="M 405 104 C 394 94, 384 96, 378 102 C 388 103, 394 106, 398 111 C 388 109, 382 112, 379 117 C 389 117, 396 119, 401 122"
        fill="#f8f5ee" stroke="#8c8273" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pelican Beak & Iconic Gular Pouch -->
  <g>
    <!-- Lower Gular Pouch -->
    <path d="M 444 124
             C 454 158, 488 184, 528 174
             C 554 167, 572 148, 580 133
             L 446 121 Z"
          fill="url(#pouchGrad)" stroke="#b45309" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Pouch Soft Crease / Highlight -->
    <path d="M 468 136 C 482 158, 514 168, 544 156" fill="none" stroke="#ffd8a8" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
    <path d="M 462 146 C 480 165, 512 172, 540 162" fill="none" stroke="#c2410c" stroke-width="1.3" stroke-linecap="round" opacity="0.35"/>

    <!-- Upper Mandible with Hooked Nail -->
    <path d="M 442 106
             C 482 104, 536 112, 578 124
             C 586 126, 591 132, 585 138
             C 581 141, 577 137, 576 133
             C 540 128, 488 125, 444 124 Z"
          fill="url(#beakTopGrad)" stroke="#b45309" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Upper Bill Ridge & Nostril Highlight -->
    <path d="M 454 111 C 495 112, 542 118, 576 127" fill="none" stroke="#fef08a" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <ellipse cx="468" cy="116" rx="4" ry="1.6" fill="#9a3412" opacity="0.45"/>
  </g>

  <!-- Expressive Eye -->
  <g>
    <!-- Pale yellow orbital skin -->
    <ellipse cx="430" cy="115" rx="10" ry="8.5" fill="#fde68a" opacity="0.8"/>
    <!-- Eye white & dark iris -->
    <circle cx="431" cy="115" r="6" fill="#ffffff" stroke="#475569" stroke-width="1.4"/>
    <circle cx="432.5" cy="114.5" r="3.6" fill="#1e293b"/>
    <circle cx="433.8" cy="113" r="1.4" fill="#ffffff"/>
    <!-- Cheerful brow curve -->
    <path d="M 422 107 Q 431 102 440 107" fill="none" stroke="#8c8273" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- ==================== 5. NEAR-SIDE LEG, CRANK & WING ==================== -->
  <!-- Near Leg & Webbed Foot (Pushing Down on Front Pedal) -->
  <g>
    <!-- Thigh / Drumstick Feathers -->
    <path d="M 332 266 C 340 282, 356 288, 372 282" fill="#f1ece1" stroke="#8c8273" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Orange Leg -->
    <path d="M 354 278 L 382 356 L 402 432" fill="none" stroke="#b45309" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 354 278 L 382 356 L 402 432" fill="none" stroke="url(#legGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Near Crank Arm (Behind Foot) -->
    <line x1="380" y1="400" x2="406" y2="438" stroke="url(#chromeGrad)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="380" cy="400" r="4.5" fill="#334155"/>
    <!-- Near Pedal -->
    <rect x="391" y="434" width="32" height="9" rx="3.5" fill="#1e293b"/>
    <rect x="395" y="437" width="24" height="3" rx="1.5" fill="#f59e0b"/>
    <!-- Near Webbed Foot Gripping Pedal -->
    <path d="M 392 432 C 402 424, 422 425, 434 435 C 424 438, 405 439, 390 436 Z"
          fill="#f59e0b" stroke="#b45309" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Toe Lines -->
    <path d="M 404 431 L 424 434 M 402 433 L 418 436" stroke="#b45309" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- Near Wing (Sweeping Forward to Hold Near Handlebar Grip) -->
  <g>
    <!-- Main Wing Body -->
    <path d="M 304 206
             C 332 186, 374 190, 412 204
             C 430 210, 446 216, 456 222
             C 461 226, 458 235, 449 235
             C 430 235, 402 246, 362 248
             C 324 250, 294 236, 304 206 Z"
          fill="url(#wingGrad)" stroke="#8c8273" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Dark Slate Primary Flight Feather Tips (Authentic American White Pelican Detail) -->
    <path d="M 406 205
             C 426 210, 446 216, 456 222
             C 461 226, 458 235, 449 235
             C 436 235, 420 239, 404 242
             C 412 228, 412 216, 406 205 Z"
          fill="#334155" stroke="#1e293b" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Layered Feather Scallops -->
    <path d="M 326 214 C 344 218, 364 218, 384 214" fill="none" stroke="#b5aa99" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 332 228 C 354 232, 376 230, 398 224" fill="none" stroke="#b5aa99" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Wingtip "Fingers" Wrapping the Handlebar Grip -->
    <path d="M 442 220 C 450 220, 455 224, 452 229" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 436 225 C 446 225, 452 229, 448 233" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
