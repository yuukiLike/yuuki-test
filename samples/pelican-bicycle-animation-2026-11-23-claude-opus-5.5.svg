<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a8b"/>
      <stop offset="0.55" stop-color="#ffc988"/>
      <stop offset="1" stop-color="#fff1c9"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa3c7"/>
      <stop offset="1" stop-color="#2b6f99"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde3ea"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbf5e"/>
      <stop offset="1" stop-color="#f0782a"/>
    </linearGradient>
    <clipPath id="frameClip"><rect width="400" height="300"/></clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
  <!-- Sky, sun, sea -->
  <rect width="400" height="300" fill="url(#sky)"/>
  <circle cx="330" cy="192" r="34" fill="#fff3b0" opacity="0.95"/>
  <rect y="190" width="400" height="80" fill="url(#sea)"/>
  <g stroke="#bfe6f5" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <g>
      <line x1="300" y1="200" x2="360" y2="200"/>
      <line x1="40" y1="215" x2="80" y2="215"/>
      <line x1="200" y1="232" x2="250" y2="232"/>
      <line x1="500" y1="210" x2="540" y2="210"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -200 0" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Drifting clouds -->
  <g fill="#ffffff" opacity="0.85">
    <g>
      <ellipse cx="0" cy="50" rx="30" ry="10"/>
      <ellipse cx="20" cy="43" rx="20" ry="11"/>
      <animateTransform attributeName="transform" type="translate" values="440 0; -60 0" dur="18s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="90" rx="22" ry="7"/>
      <ellipse cx="12" cy="85" rx="12" ry="7"/>
      <animateTransform attributeName="transform" type="translate" values="260 0; -40 0; -40 0" keyTimes="0; 0.6; 1" dur="15s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Seagull -->
  <path d="M0 0 q6 -6 12 0 q6 -6 12 0" fill="none" stroke="#5d4a4a" stroke-width="2" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="420 70; 200 55; -40 75" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Road -->
  <rect y="268" width="400" height="32" fill="#6d6875"/>
  <rect y="266" width="400" height="4" fill="#e5c07b"/>
  <g stroke="#f8f9fa" stroke-width="3" stroke-linecap="round">
    <g>
      <line x1="10" y1="285" x2="40" y2="285"/>
      <line x1="90" y1="285" x2="120" y2="285"/>
      <line x1="170" y1="285" x2="200" y2="285"/>
      <line x1="250" y1="285" x2="280" y2="285"/>
      <line x1="330" y1="285" x2="360" y2="285"/>
      <line x1="410" y1="285" x2="440" y2="285"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -80 0" dur="0.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
    <line x1="40" y1="150" x2="70" y2="150">
      <animate attributeName="opacity" values="0;0.9;0" dur="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="10 0; -20 0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="30" y1="175" x2="66" y2="175">
      <animate attributeName="opacity" values="0;0.9;0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="10 0; -20 0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="48" y1="125" x2="74" y2="125">
      <animate attributeName="opacity" values="0;0.9;0" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="10 0; -20 0" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Wheels -->
  <g fill="none" stroke="#2d3436">
    <circle cx="120" cy="220" r="48" stroke-width="6"/>
    <circle cx="290" cy="220" r="48" stroke-width="6"/>
    <circle cx="120" cy="220" r="44" stroke="#636e72" stroke-width="1.5"/>
    <circle cx="290" cy="220" r="44" stroke="#636e72" stroke-width="1.5"/>
  </g>
  <g stroke="#b2bec3" stroke-width="1.2">
    <g>
      <g transform="translate(120 220)">
        <line x1="-44" y1="0" x2="44" y2="0"/>
        <line x1="0" y1="-44" x2="0" y2="44"/>
        <line x1="-31" y1="-31" x2="31" y2="31"/>
        <line x1="-31" y1="31" x2="31" y2="-31"/>
        <line x1="-17" y1="-41" x2="17" y2="41"/>
        <line x1="-41" y1="-17" x2="41" y2="17"/>
        <line x1="-17" y1="41" x2="17" y2="-41"/>
        <line x1="-41" y1="17" x2="41" y2="-17"/>
        <circle cx="0" cy="-40" r="2.5" fill="#f1c40f" stroke="none"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" values="0 120 220; 360 120 220" dur="0.8s" repeatCount="indefinite"/>
    </g>
    <g>
      <g transform="translate(290 220)">
        <line x1="-44" y1="0" x2="44" y2="0"/>
        <line x1="0" y1="-44" x2="0" y2="44"/>
        <line x1="-31" y1="-31" x2="31" y2="31"/>
        <line x1="-31" y1="31" x2="31" y2="-31"/>
        <line x1="-17" y1="-41" x2="17" y2="41"/>
        <line x1="-41" y1="-17" x2="41" y2="17"/>
        <line x1="-17" y1="41" x2="17" y2="-41"/>
        <line x1="-41" y1="17" x2="41" y2="-17"/>
        <circle cx="0" cy="-40" r="2.5" fill="#f1c40f" stroke="none"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" values="0 290 220; 360 290 220" dur="0.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <circle cx="120" cy="220" r="5" fill="#2d3436"/>
  <circle cx="290" cy="220" r="5" fill="#2d3436"/>

  <!-- Far leg (behind frame) -->
  <polyline fill="none" stroke="#d9822b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"
    points="190,145 220.0,187.5 184,225">
    <animate attributeName="points" dur="1s" repeatCount="indefinite"
      values="190,145 220.0,187.5 184,225;
              190,145 228.4,180.1 188.7,213.7;
              190,145 235.2,170.7 200,209;
              190,145 236.5,168.2 211.3,213.7;
              190,145 232.1,175.6 216,225;
              190,145 222.6,185.5 211.3,236.3;
              190,145 214.3,191.0 200,241;
              190,145 214.2,191.0 188.7,236.3;
              190,145 220.0,187.5 184,225"/>
  </polyline>
  <!-- Far crank arm, pedal, foot -->
  <g transform="translate(200 225)">
    <g>
      <line x1="0" y1="0" x2="-16" y2="0" stroke="#4a4a4a" stroke-width="4" stroke-linecap="round"/>
      <g transform="translate(-16 0)">
        <g>
          <rect x="-7" y="-2" width="14" height="4" rx="1" fill="#4a4a4a"/>
          <path d="M-2 -1 l12 -3 l-2 5 l-4 0 l-4 3 z" fill="#d9822b" opacity="0.8"/>
          <animateTransform attributeName="transform" type="rotate" values="0; -360" dur="1s" repeatCount="indefinite"/>
        </g>
      </g>
      <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Frame -->
  <g stroke="#1abc9c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="120,220 200,225 180,152 120,220"/>
    <line x1="180" y1="152" x2="268" y2="150"/>
    <line x1="200" y1="225" x2="274" y2="168"/>
    <line x1="266" y1="144" x2="276" y2="172"/>
    <line x1="276" y1="172" x2="290" y2="220"/>
  </g>
  <!-- Chain -->
  <path d="M200 211 L120 213 M200 239 L120 227" stroke="#7f8c8d" stroke-width="1.5" fill="none" stroke-dasharray="3 2">
    <animate attributeName="stroke-dashoffset" values="0; -10" dur="0.4s" repeatCount="indefinite"/>
  </path>
  <circle cx="120" cy="220" r="7" fill="none" stroke="#7f8c8d" stroke-width="2"/>
  <!-- Seat post & saddle -->
  <line x1="180" y1="152" x2="177" y2="140" stroke="#636e72" stroke-width="4"/>
  <path d="M156 138 Q176 132 194 138 Q176 144 156 138 Z" fill="#2d3436"/>
  <!-- Stem & handlebar -->
  <line x1="266" y1="144" x2="263" y2="128" stroke="#636e72" stroke-width="4" stroke-linecap="round"/>
  <path d="M258 128 L280 126 Q290 126 290 135" fill="none" stroke="#2d3436" stroke-width="5" stroke-linecap="round"/>
  <!-- Headlight -->
  <circle cx="281" cy="152" r="4" fill="#ffeaa7" stroke="#636e72" stroke-width="1.5"/>

  <!-- Tail -->
  <g>
    <path d="M142 116 L110 102 L116 114 L104 119 L118 125 L112 135 L148 130 Z" fill="#ecf0f1" stroke="#b2bec3" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="rotate" values="0 145 122; -4 145 122; 0 145 122" dur="0.5s" repeatCount="indefinite"/>
  </g>

  <!-- Body -->
  <ellipse cx="182" cy="118" rx="46" ry="30" fill="url(#body)" stroke="#b2bec3" stroke-width="1.5"/>

  <!-- Scarf -->
  <path fill="#e84393" d="M214 92 Q190 88 166 94 L168 102 Q190 98 214 101 Z">
    <animate attributeName="d" dur="0.6s" repeatCount="indefinite"
      values="M214 92 Q190 88 166 94 L168 102 Q190 98 214 101 Z;
              M214 92 Q190 98 164 88 L166 96 Q190 106 214 101 Z;
              M214 92 Q190 88 166 94 L168 102 Q190 98 214 101 Z"/>
  </path>

  <!-- Head & neck (bobbing) -->
  <g>
    <path d="M206 102 C214 82 210 72 222 58 L240 64 C230 76 232 90 226 110 Z" fill="url(#body)" stroke="#b2bec3" stroke-width="1.5"/>
    <path d="M206 92 Q216 98 230 94 L230 100 Q216 104 205 99 Z" fill="#fd79a8"/>
    <circle cx="234" cy="58" r="16" fill="#ffffff" stroke="#b2bec3" stroke-width="1.5"/>
    <path d="M222 46 Q230 38 242 44" fill="none" stroke="#f5d76e" stroke-width="3" stroke-linecap="round"/>
    <path d="M246 56 L330 74 L326 80 L248 66 Z" fill="#f39c12" stroke="#d35400" stroke-width="1.2"/>
    <path fill="url(#pouch)" stroke="#d35400" stroke-width="1.2" d="M248 66 L326 80 Q300 108 262 98 Q246 90 248 66 Z">
      <animate attributeName="d" dur="0.5s" repeatCount="indefinite"
        values="M248 66 L326 80 Q300 108 262 98 Q246 90 248 66 Z;
                M248 66 L326 80 Q302 114 262 102 Q246 92 248 66 Z;
                M248 66 L326 80 Q300 108 262 98 Q246 90 248 66 Z"/>
    </path>
    <path d="M326 74 l8 4 l-8 2 z" fill="#d35400"/>
    <circle cx="238" cy="54" r="3.5" fill="#2d3436"/>
    <circle cx="239.2" cy="52.8" r="1.1" fill="#ffffff"/>
    <!-- blink -->
    <rect x="233" y="49" width="10" height="0" fill="#ffffff">
      <animate attributeName="height" values="0;0;10;0" keyTimes="0;0.9;0.95;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <animateTransform attributeName="transform" type="rotate" values="0 212 104; -3 212 104; 0 212 104" dur="0.5s" repeatCount="indefinite"/>
  </g>

  <!-- Wing gripping handlebar -->
  <path d="M162 104 C188 92 218 100 238 112 C254 120 268 124 284 128 C270 134 252 134 238 130 C216 136 186 136 162 124 Z" fill="#f5f6fa" stroke="#b2bec3" stroke-width="1.5"/>
  <path d="M178 122 Q198 128 222 126 M186 112 Q206 114 228 120" fill="none" stroke="#c8d0d6" stroke-width="1.2"/>
  <path d="M152 112 Q158 104 166 106 L164 124 Q154 122 152 112 Z" fill="#2d3436" opacity="0.8"/>

  <!-- Near leg -->
  <polyline fill="none" stroke="#f39c12" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"
    points="190,145 232.1,175.6 216,225">
    <animate attributeName="points" dur="1s" repeatCount="indefinite"
      values="190,145 232.1,175.6 216,225;
              190,145 222.6,185.5 211.3,236.3;
              190,145 214.3,191.0 200,241;
              190,145 214.2,191.0 188.7,236.3;
              190,145 220.0,187.5 184,225;
              190,145 228.4,180.1 188.7,213.7;
              190,145 235.2,170.7 200,209;
              190,145 236.5,168.2 211.3,213.7;
              190,145 232.1,175.6 216,225"/>
  </polyline>

  <!-- Chainring + near crank arm, pedal, foot -->
  <g transform="translate(200 225)">
    <g>
      <circle r="13" fill="none" stroke="#7f8c8d" stroke-width="3" stroke-dasharray="4 2.8"/>
      <circle r="3" fill="#2d3436"/>
      <line x1="0" y1="0" x2="16" y2="0" stroke="#2d3436" stroke-width="4" stroke-linecap="round"/>
      <g transform="translate(16 0)">
        <g>
          <rect x="-7" y="-2" width="14" height="4" rx="1" fill="#2d3436"/>
          <path d="M-2 -1 l13 -3 l-2 5 l-5 0 l-4 3 z" fill="#f39c12" stroke="#d35400" stroke-width="1"/>
          <animateTransform attributeName="transform" type="rotate" values="0; -360" dur="1s" repeatCount="indefinite"/>
        </g>
      </g>
      <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="1s" repeatCount="indefinite"/>
    </g>
  </g>
  </g>
</svg>
