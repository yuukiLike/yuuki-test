<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Riding a Bicycle along a Coastal Boardwalk</title>
  <desc>A white pelican with a large golden-orange beak and throat pouch riding a coral-red cruiser bicycle with a wicker basket along a sunny seaside promenade.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90D5FF"/>
      <stop offset="60%" stop-color="#D8F2FF"/>
      <stop offset="100%" stop-color="#FFF2D6"/>
    </linearGradient>

    <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E8BC0"/>
      <stop offset="100%" stop-color="#1E6091"/>
    </linearGradient>

    <linearGradient id="pathGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E7D8C0"/>
      <stop offset="100%" stop-color="#CFB896"/>
    </linearGradient>

    <linearGradient id="sunGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FFAD5A"/>
    </linearGradient>

    <linearGradient id="pelicanBody" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F7F5F0"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="wingFeathers" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="55%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="billTop" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#FDE08D"/>
      <stop offset="70%" stop-color="#F6AD55"/>
      <stop offset="100%" stop-color="#E86F45"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F9B866"/>
      <stop offset="65%" stop-color="#EE7B45"/>
      <stop offset="100%" stop-color="#D95D39"/>
    </linearGradient>

    <linearGradient id="basketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DFB17B"/>
      <stop offset="100%" stop-color="#B07A43"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="560" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="135" cy="105" r="56" fill="#FFE8A3" opacity="0.4"/>
  <circle cx="135" cy="105" r="34" fill="url(#sunGlow)"/>

  <!-- Soft Clouds -->
  <g fill="#FFFFFF" opacity="0.88">
    <path d="M235 95 C235 80 256 74 268 82 C278 66 308 68 315 84 C330 84 337 98 326 106 L243 106 C232 106 229 99 235 95 Z"/>
    <path d="M585 112 C585 98 604 92 616 100 C626 86 654 89 660 103 C674 103 680 116 670 123 L592 123 C582 123 579 116 585 112 Z"/>
  </g>

  <!-- Distant Sea & Horizon -->
  <rect x="0" y="348" width="800" height="52" fill="url(#ocean)"/>
  <g stroke="#90E0EF" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="45" y1="364" x2="120" y2="364"/>
    <line x1="175" y1="378" x2="265" y2="378"/>
    <line x1="490" y1="366" x2="575" y2="366"/>
    <line x1="650" y1="380" x2="755" y2="380"/>
  </g>

  <!-- Distant Sailboat -->
  <g transform="translate(655, 316)" opacity="0.85">
    <polygon points="0,32 16,32 14,36 2,36" fill="#5C4033"/>
    <polygon points="8,6 8,30 0,30" fill="#FFFFFF"/>
    <polygon points="10,12 10,30 18,30" fill="#FFE8D6"/>
  </g>

  <!-- Wooden Boardwalk Railing -->
  <g stroke="#8D6E63" stroke-linecap="round">
    <line x1="0" y1="378" x2="800" y2="378" stroke-width="5"/>
    <line x1="0" y1="392" x2="800" y2="392" stroke-width="3"/>
    <g stroke-width="6">
      <line x1="50" y1="374" x2="50" y2="404"/>
      <line x1="170" y1="374" x2="170" y2="404"/>
      <line x1="290" y1="374" x2="290" y2="404"/>
      <line x1="410" y1="374" x2="410" y2="404"/>
      <line x1="530" y1="374" x2="530" y2="404"/>
      <line x1="650" y1="374" x2="650" y2="404"/>
      <line x1="770" y1="374" x2="770" y2="404"/>
    </g>
  </g>

  <!-- Coastal Cycling Path -->
  <rect x="0" y="400" width="800" height="160" fill="url(#pathGrad)"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#9C8263" stroke-width="4"/>
  <line x1="0" y1="486" x2="800" y2="486" stroke="#F8F1E3" stroke-width="3.5" stroke-dasharray="32 24" opacity="0.75"/>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="488" rx="228" ry="15" fill="#7D684A" opacity="0.32"/>

  <!-- Far Leg & Webbed Foot (behind bicycle frame, on upper-front pedal) -->
  <g id="far-leg">
    <path d="M342 292 L388 338 L414 384" fill="none" stroke="#D95D39" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M402 384 L434 386 L430 393 L403 391 Z" fill="#D95D39" stroke="#A84024" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Far Crank & Pedal -->
  <line x1="384" y1="416" x2="416" y2="388" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
  <rect x="404" y="385" width="24" height="6" rx="2.5" fill="#1E293B"/>

  <!-- Far Wing (reaching to far handlebar grip) -->
  <path d="M372 222 C406 212 444 206 482 216 C488 222 478 232 458 234 C428 237 398 242 372 238 Z" fill="#94A3B8" stroke="#475569" stroke-width="2" stroke-linejoin="round"/>

  <!-- Rear Wheel -->
  <g id="rear-wheel" transform="translate(254, 408)">
    <circle r="76" fill="none" stroke="#24292F" stroke-width="11"/>
    <circle r="76" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.5"/>
    <circle r="67" fill="none" stroke="#CBD5E1" stroke-width="4"/>
    <g stroke="#94A3B8" stroke-width="1.8">
      <line x1="0" y1="-65" x2="0" y2="65"/>
      <line x1="-65" y1="0" x2="65" y2="0"/>
      <line x1="-46" y1="-46" x2="46" y2="46"/>
      <line x1="-46" y1="46" x2="46" y2="-46"/>
      <line x1="-32.5" y1="-56.3" x2="32.5" y2="56.3"/>
      <line x1="-56.3" y1="-32.5" x2="56.3" y2="32.5"/>
      <line x1="-56.3" y1="32.5" x2="56.3" y2="-32.5"/>
      <line x1="-32.5" y1="56.3" x2="32.5" y2="-56.3"/>
    </g>
    <!-- Rear Cassette & Hub -->
    <circle r="15" fill="#64748B" stroke="#334155" stroke-width="2"/>
    <circle r="8" fill="#CBD5E1" stroke="#334155" stroke-width="2"/>
    <!-- Rear Fender -->
    <path d="M-78 -14 A80 80 0 0 1 56 -58" fill="none" stroke="#2A9D8F" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Front Wheel -->
  <g id="front-wheel" transform="translate(546, 408)">
    <circle r="76" fill="none" stroke="#24292F" stroke-width="11"/>
    <circle r="76" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.5"/>
    <circle r="67" fill="none" stroke="#CBD5E1" stroke-width="4"/>
    <g stroke="#94A3B8" stroke-width="1.8">
      <line x1="0" y1="-65" x2="0" y2="65"/>
      <line x1="-65" y1="0" x2="65" y2="0"/>
      <line x1="-46" y1="-46" x2="46" y2="46"/>
      <line x1="-46" y1="46" x2="46" y2="-46"/>
      <line x1="-32.5" y1="-56.3" x2="32.5" y2="56.3"/>
      <line x1="-56.3" y1="-32.5" x2="56.3" y2="32.5"/>
      <line x1="-56.3" y1="32.5" x2="56.3" y2="-32.5"/>
      <line x1="-32.5" y1="56.3" x2="32.5" y2="-56.3"/>
    </g>
    <circle r="9" fill="#CBD5E1" stroke="#334155" stroke-width="2"/>
    <!-- Front Fender -->
    <path d="M-58 -55 A80 80 0 0 1 78 -14" fill="none" stroke="#2A9D8F" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Bicycle Chain -->
  <path d="M254 395 L384 394 A22 22 0 0 1 384 438 L254 421 A13 13 0 0 1 254 395 Z" fill="none" stroke="#334155" stroke-width="3.5" stroke-dasharray="5 2"/>

  <!-- Bicycle Frame (Coral Red) -->
  <g stroke="#E05A47" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Chainstay & Seatstay -->
    <line x1="254" y1="408" x2="384" y2="416"/>
    <line x1="254" y1="408" x2="336" y2="294"/>
    <!-- Seat tube -->
    <line x1="384" y1="416" x2="328" y2="268"/>
    <!-- Top tube & Down tube -->
    <line x1="336" y1="294" x2="486" y2="264"/>
    <line x1="384" y1="416" x2="496" y2="296"/>
    <!-- Head tube & Front Fork -->
    <line x1="484" y1="254" x2="498" y2="300"/>
    <path d="M498 300 Q520 358 546 408"/>
  </g>

  <!-- Frame Specular Highlights -->
  <g stroke="#F8A195" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.75">
    <line x1="340" y1="291" x2="482" y2="262"/>
    <line x1="388" y1="411" x2="492" y2="294"/>
  </g>

  <!-- Front Wicker Basket & Peek-a-boo Fish -->
  <g id="basket">
    <!-- Strut to head tube -->
    <line x1="496" y1="292" x2="532" y2="296" stroke="#64748B" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Little silver fish peeking out -->
    <g transform="translate(534, 244) rotate(-18)">
      <path d="M0 10 C8 0 24 0 34 10 C24 20 8 20 0 10 Z" fill="#CBD5E1" stroke="#475569" stroke-width="1.6"/>
      <polygon points="32,10 42,3 42,17" fill="#94A3B8" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="9" cy="8" r="1.8" fill="#1E293B"/>
    </g>
    <!-- Basket body -->
    <path d="M506 250 L574 250 L566 298 L512 298 Z" fill="url(#basketGrad)" stroke="#7C4A2D" stroke-width="2.2" stroke-linejoin="round"/>
    <g stroke="#8C5832" stroke-width="1.6" opacity="0.65">
      <line x1="509" y1="262" x2="572" y2="262"/>
      <line x1="510" y1="274" x2="570" y2="274"/>
      <line x1="511" y1="286" x2="568" y2="286"/>
      <line x1="526" y1="250" x2="528" y2="298"/>
      <line x1="542" y1="250" x2="542" y2="298"/>
      <line x1="558" y1="250" x2="555" y2="298"/>
    </g>
    <rect x="503" y="246" width="74" height="7" rx="3" fill="#C68B59" stroke="#7C4A2D" stroke-width="2"/>
  </g>

  <!-- Stem, Handlebars & Brass Bell -->
  <path d="M484 254 L476 220 C474 212 462 212 450 222" fill="none" stroke="#CBD5E1" stroke-width="7" stroke-linecap="round"/>
  <path d="M476 220 C482 214 489 214 494 217" fill="none" stroke="#94A3B8" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Brass Bell -->
  <path d="M472 211 A7 7 0 0 1 486 211 Z" fill="#F4C430" stroke="#9A6B16" stroke-width="1.5"/>
  <!-- Near Handlebar Grip -->
  <rect x="436" y="217" width="20" height="9" rx="4.5" transform="rotate(-22 446 221)" fill="#7C4A2D" stroke="#4A2B18" stroke-width="1.5"/>

  <!-- Leather Saddle -->
  <path d="M300 264 C314 256 346 258 355 266 C357 272 346 276 328 275 C308 274 295 270 300 264 Z" fill="#7C4A2D" stroke="#4A2B18" stroke-width="2"/>
  <circle cx="312" cy="267" r="1.8" fill="#F4C430"/>
  <circle cx="322" cy="268" r="1.8" fill="#F4C430"/>

  <!-- Chainring -->
  <circle cx="384" cy="416" r="22" fill="#E2E8F0" stroke="#475569" stroke-width="3"/>
  <circle cx="384" cy="416" r="13" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="384" cy="416" r="7" fill="#334155"/>

  <!-- Pelican -->
  <g id="pelican">
    <!-- Short Tail Feathers -->
    <path d="M276 244 L236 228 L250 246 L232 252 L262 264 Z" fill="#CBD5E1" stroke="#475569" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Plump Feathered Body -->
    <path d="M272 246 C276 206 318 190 360 202 C394 212 406 248 390 278 C374 304 326 308 296 292 C276 280 268 264 272 246 Z" fill="url(#pelicanBody)" stroke="#475569" stroke-width="2.5"/>

    <!-- Graceful S-Curved Neck & Head -->
    <path d="M348 214 C366 184 374 148 394 120 C406 102 434 98 448 112 C460 124 456 144 442 156 C420 176 404 214 392 246" fill="url(#pelicanBody)" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Breezy Head Crest -->
    <path d="M400 112 C386 96 376 100 390 116 C376 108 370 114 388 124" fill="#FFFFFF" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Eye Ring & Expressive Eye -->
    <ellipse cx="430" cy="126" rx="11" ry="8.5" fill="#FDE68A"/>
    <circle cx="432" cy="125" r="4.8" fill="#1E293B"/>
    <circle cx="433.6" cy="123.3" r="1.6" fill="#FFFFFF"/>

    <!-- Iconic Pelican Throat Pouch -->
    <path d="M444 138 C488 143 546 147 586 144 C578 176 544 202 496 200 C460 198 436 176 440 148 Z" fill="url(#pouchGrad)" stroke="#C2410C" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Subtle Pouch Fold Lines -->
    <path d="M460 158 C486 174 522 176 550 162" fill="none" stroke="#C2410C" stroke-width="1.6" opacity="0.45" stroke-linecap="round"/>
    <path d="M472 174 C496 186 520 186 538 176" fill="none" stroke="#C2410C" stroke-width="1.4" opacity="0.35" stroke-linecap="round"/>

    <!-- Long Upper Bill with Hooked Nail -->
    <path d="M444 122 C488 122 552 128 594 139 C601 141 602 150 594 152 C590 153 587 157 583 151 C550 148 488 145 443 138 Z" fill="url(#billTop)" stroke="#C2410C" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Hooked Tip Accent -->
    <path d="M587 138 C599 140 603 149 595 154 C591 154 589 149 586 146" fill="#D95D39"/>

    <!-- Near Wing Reaching Forward to Hold Handlebar -->
    <path d="M312 228 C338 210 382 216 416 226 C432 230 444 222 452 218 C456 226 446 240 428 248 C396 262 346 274 314 260 C300 253 298 238 312 228 Z" fill="url(#wingFeathers)" stroke="#334155" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- Layered Wing Feather Strokes -->
    <path d="M336 240 C366 238 394 242 420 238" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M348 252 C374 252 398 250 418 245" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Near Leg & Webbed Foot (on lower-back pedal) -->
  <g id="near-leg">
    <path d="M328 292 L366 364 L354 442" fill="none" stroke="#F07C4A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M340 442 L374 446 L370 454 L340 450 Z" fill="#F07C4A" stroke="#C2410C" stroke-width="1.8" stroke-linejoin="round"/>
  </g>

  <!-- Near Crank & Pedal -->
  <line x1="384" y1="416" x2="354" y2="448" stroke="#94A3B8" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="384" cy="416" r="5" fill="#F8FAFC"/>
  <rect x="340" y="446" width="28" height="7" rx="2.5" fill="#1E293B"/>
</svg>
