<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"
     role="img" aria-labelledby="title description" stroke-linecap="round" stroke-linejoin="round">
  <title id="title">海堤晨骑 · Dawn Patrol</title>
  <desc id="description">红围巾的白鹈鹕骑着一辆珊瑚红自行车沿海堤前进。轮辐转动，脚蹼跟着踏板画圈，海面与路面从身边掠过。</desc>

  <style>
    .wheel-spin { animation: roll 1.16s linear infinite; }
    .road-motion { animation: road .56s linear infinite; }
    .water-motion { animation: tide 20s linear infinite; }
    .scarf-tip { animation: flutter .9s ease-in-out infinite; }
    .rider-bob { animation: bob .825s ease-in-out infinite; }
    .blink { animation: blink 5.8s ease-in-out infinite; }
    .wheel-spin, .scarf-tip, .blink { transform-origin: 0 0; }
    .pedal-still { display: none; }
    @keyframes roll { to { transform: rotate(360deg); } }
    @keyframes road { to { transform: translateX(-315px); } }
    @keyframes tide { to { transform: translateX(-480px); } }
    @keyframes flutter {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes bob { 50% { transform: translateY(-2px); } }
    @keyframes blink { 0%, 91%, 95%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.08); } }
    @media (prefers-reduced-motion: reduce) {
      .wheel-spin, .road-motion, .water-motion, .scarf-tip, .rider-bob, .blink { animation: none; }
      .pedal-motion { display: none; }
      .pedal-still { display: inline; }
    }
  </style>

  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#9dd2cc"/><stop offset=".63" stop-color="#f1dbab"/><stop offset="1" stop-color="#fae9ba"/>
    </linearGradient>
    <linearGradient id="sun" x2="0" y2="1">
      <stop stop-color="#ffedb1"/><stop offset="1" stop-color="#eba263"/>
    </linearGradient>
    <linearGradient id="water" x2="0" y2="1">
