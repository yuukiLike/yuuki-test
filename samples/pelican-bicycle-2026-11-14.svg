<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" fill="none" role="img" aria-labelledby="title description">
  <title id="title">海风里的鹈鹕骑手</title>
  <desc id="description">一只白色鹈鹕张着金黄色长嘴，橙粉色喉囊鼓起，双翼扶住车把，两只蹼足分别踩在高低踏板上，骑着蓝色自行车经过阳光下的海岸。完整的车轮、辐条、菱形车架和链条清晰可见。</desc>
  <defs>
    <linearGradient id="sky" x1="600" y1="82" x2="600" y2="857" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e1f0ef"/>
      <stop offset="1" stop-color="#f2f4df"/>
    </linearGradient>
    <linearGradient id="plumage" x1="463" y1="285" x2="463" y2="575" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#e9eee4"/>
    </linearGradient>
    <linearGradient id="pouch" x1="787" y1="280" x2="787" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbc17d"/>
      <stop offset="1" stop-color="#ed9878"/>
    </linearGradient>
    <clipPath id="coast">
      <rect x="156" y="82" width="888" height="775" rx="365"/>
    </clipPath>
    <g id="spokes" stroke="#a2b9b6" stroke-width="2" stroke-linecap="round">
      <path d="M0-132V132M-132 0H132"/>
      <path d="M0-132V132M-132 0H132" transform="rotate(22.5)"/>
      <path d="M0-132V132M-132 0H132" transform="rotate(45)"/>
      <path d="M0-132V132M-132 0H132" transform="rotate(67.5)"/>
    </g>
    <g id="wheel">
      <circle r="150" stroke="#294650" stroke-width="14"/>
      <circle r="139" stroke="#ead8ae" stroke-width="8"/>
      <circle r="133" stroke="#7d9b9c" stroke-width="2"/>
      <use href="#spokes"/>
      <path d="M-143-18a144 144 0 0 1 261-65" stroke="#637e81" stroke-width="3" stroke-linecap="round"/>
      <circle r="12" fill="#fff5dc" stroke="#294650" stroke-width="5"/>
      <circle r="4" fill="#294650"/>
    </g>
  </defs>

  <!-- The coast is clipped independently so every part of the rider stays visible. -->
  <path d="M0 0h1200v1000H0Z" fill="#fbf7eb"/>
  <g clip-path="url(#coast)">
    <path d="M156 82h888v775H156Z" fill="url(#sky)"/>
    <circle cx="866" cy="226" r="71" fill="#f4c56f"/>
    <circle cx="866" cy="226" r="88" stroke="#f4c56f" stroke-width="2" opacity=".35"/>
    <g fill="#fffdf4" opacity=".85">
      <path d="M252 296c-4-14 7-27 22-25 4-23 35-28 47-7 18-5 33 11 28 27h-97Z"/>
      <path d="M870 461c-2-10 6-19 16-18 4-17 27-21 36-5 13-3 24 7 22 19h-74Z"/>
    </g>
    <path d="M156 546c102-15 206 14 326 1s203-9 321 0 173-12 241-5v315H156Z" fill="#afd2cf"/>
    <path d="M156 626c130-20 235 21 382 5s292-6 506 6v220H156Z" fill="#c4ded4"/>
    <path d="M156 755c161-27 282 35 443 18 198-21 304-9 445 18v66H156Z" fill="#eae3c8"/>
    <g stroke="#f6f8e8" stroke-width="4" stroke-linecap="round">
      <path d="M195 581h68m17 0h20m608-13h55m16 0h19M183 669h47m694-14h64M230 712h70m622 7h63"/>
    </g>
  </g>
  <ellipse cx="600" cy="918" rx="432" ry="15" fill="#294650" opacity=".09"/>
  <path d="M191 906h817" stroke="#d8d8bc" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#8faa91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="m164 880-4-26m4 26-14-13m14 13 12-20m855 24 8-31m-8 31-11-17m11 17 17-12"/>
  </g>
  <g fill="#b9c2a4">
