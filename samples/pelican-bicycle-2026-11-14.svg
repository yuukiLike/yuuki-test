  <circle cx="566" cy="748" r="7" fill="#294650"/>
  <circle cx="762" cy="442" r="12" fill="#f2bf61" stroke="#294650" stroke-width="3.5"/>
  <path d="M756 439c2-4 6-5 9-3" stroke="#fff1ba" stroke-width="3" stroke-linecap="round"/>

  <!-- The near ankle reaches the low pedal; separate toes share a webbed outline. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="m486 551 47 73-28 147" stroke="#294650" stroke-width="20"/>
    <path d="m486 551 47 73-28 147" stroke="#f0b469" stroke-width="12"/>
    <path d="m514 718 8 2m-10 9 8 2m-10 9 8 2" stroke="#c28851" stroke-width="2.5"/>
    <path d="M500 767c-2 10-13 19-18 27-3 5 0 8 6 7l19-4 17 4 16-4 17 3c5 0 7-4 2-8-10-8-27-12-45-16l-5-9Z" fill="#f5bc72" stroke="#294650" stroke-width="4.5"/>
    <path d="m513 783 11 14m1-11 15 8" stroke="#c28851" stroke-width="2.5"/>
