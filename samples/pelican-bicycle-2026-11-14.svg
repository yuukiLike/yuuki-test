  <path d="M668 243c72 5 173 20 266 40" stroke="#ffe5a1" stroke-width="5" stroke-linecap="round"/>
  <path d="M667 259c76 15 193 30 281 35" stroke="#bb874a" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="679" cy="247" rx="5" ry="2.5" transform="rotate(7 679 247)" fill="#b08348"/>

  <!-- A forward-looking eye and small feather marks keep the face legible at small sizes. -->
  <ellipse cx="632" cy="220" rx="17" ry="19" fill="#eadfc0"/>
  <ellipse cx="634" cy="220" rx="11" ry="13" fill="#fffdf5"/>
  <ellipse cx="637" cy="220" rx="7.5" ry="10" fill="#294650"/>
  <circle cx="639" cy="216" r="3" fill="#fffdf5"/>
  <path d="M619 197c8-5 16-5 23-1" stroke="#294650" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="620" cy="249" rx="12" ry="7" fill="#efb59a" opacity=".7"/>
  <path d="m584 216-7 5m6 6-7 5" stroke="#bdcec4" stroke-width="3" stroke-linecap="round"/>

  <!-- The foreground wing ends on the lower grip, with layered feathers instead of fingers. -->
  <path d="M367 464c21-20 54-8 82 11 35 22 61 40 106 40 65-1 129-21 181-40 15-6 35-11 50-7 10 4 10 12-1 16l-14 6c18-4 30 1 20 9-14 10-32 13-53 14-64 19-116 50-186 47-68 0-133-20-168-45-21-15-33-34-17-51Z" fill="#fffdf3" stroke="#294650" stroke-width="5" stroke-linejoin="round"/>
