  <!-- The far wing wraps over the upper handlebar grip. -->
  <path d="M601 424c45-8 63 7 88 15 31 10 65-6 95-9 16-2 28 1 28 8 0 5-9 8-18 8 19-2 27 5 18 11-21 13-56 10-83 7-56-3-94-6-123-16Z" fill="#e2eadd" stroke="#294650" stroke-width="5" stroke-linejoin="round"/>
  <path d="M659 440c34 16 70 19 104 9m33-9-9 3" stroke="#aebfb4" stroke-width="3" stroke-linecap="round"/>

