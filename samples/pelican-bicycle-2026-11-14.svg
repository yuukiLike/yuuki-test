  <path d="m330 734 233-22a36 36 0 0 1 4 72l-237-22a14 14 0 0 1 0-28Z" stroke="#7d918a" stroke-width="4" stroke-linejoin="round"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="m330 748 121-167 115 167H330m121-167h305L566 748m190-174 112 174" stroke="#294650" stroke-width="20"/>
