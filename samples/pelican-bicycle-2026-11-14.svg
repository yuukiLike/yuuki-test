  <path d="M410 568c18 0 33 6 57 6" stroke="#d7ab79" stroke-width="3" stroke-linecap="round"/>
  <circle cx="566" cy="748" r="36" fill="#f6eed6" stroke="#294650" stroke-width="6"/>
  <circle cx="566" cy="748" r="26" stroke="#9db2aa" stroke-width="5" stroke-dasharray="2 8.2"/>
  <g stroke-linecap="round">
    <path d="m566 748-50 53" stroke="#294650" stroke-width="11"/>
    <path d="m566 748-50 53" stroke="#d7dfd2" stroke-width="5"/>
    <path d="M490 807h53" stroke="#294650" stroke-width="12"/>
    <path d="M498 807h36" stroke="#d1bd91" stroke-width="3"/>
