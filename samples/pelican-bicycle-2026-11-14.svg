  <path d="m270 439 39 38m-28 5 32 12" stroke="#b9c9be" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M578 198c-17-9-29-19-30-34 12 12 26 17 41 19l-11-26c14 8 25 19 32 31Z" fill="#fffdf5" stroke="#294650" stroke-width="4.5" stroke-linejoin="round"/>
