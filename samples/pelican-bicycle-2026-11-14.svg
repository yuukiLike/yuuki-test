    <ellipse cx="967" cy="936" rx="9" ry="2"/>
    <ellipse cx="1003" cy="920" rx="4" ry="2"/>
  </g>

  <!-- Shared wheel geometry keeps the two wheels the same size. -->
  <use href="#wheel" x="330" y="748"/>
  <use href="#wheel" x="868" y="748"/>
  <g stroke-linecap="round">
    <path d="M175 716a158 158 0 0 1 300-28M718 696a158 158 0 0 1 305 29" stroke="#294650" stroke-width="10"/>
