<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" fill="none" role="img" aria-labelledby="title description">
  <title id="title">骑着金色自行车的鹈鹕</title>
  <desc id="description">一只长着金黄色大嘴和橙色喉囊的白色鹈鹕，系着随风飘动的红围巾，双翼扶着车把，两只橙色蹼足踩着一高一低的踏板，骑着金黄色自行车沿海边前行。</desc>
  <defs>
    <linearGradient id="sky" x1="600" y1="110" x2="600" y2="785" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e2efee"/>
      <stop offset="1" stop-color="#f0f2df"/>
    </linearGradient>
    <linearGradient id="feathers" x1="481" y1="298" x2="481" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffef5"/>
      <stop offset="1" stop-color="#e4e9df"/>
