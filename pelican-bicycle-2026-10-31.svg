    <text x="88" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="42">A little ride, a lovely day.</text>
    <text x="1112" y="97" text-anchor="end" font-size="13" letter-spacing="2">RIDE NO. 001</text>
  </g>

