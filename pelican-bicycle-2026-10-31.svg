      <stop stop-color="#e4ecde"/>
      <stop offset="1" stop-color="#f0efdc"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0.3" y2="1">
      <stop stop-color="#f4c779"/>
      <stop offset="1" stop-color="#eaa57e"/>
    </linearGradient>
    <g id="wheel">
