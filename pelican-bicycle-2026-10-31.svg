<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title description">
  <title id="title">鹈鹕骑行日记 · 2026-10-31</title>
  <desc id="description">一只系着砖红色围巾的白色鹈鹕，伸出翅膀握住车把，双脚踩着踏板，骑着青绿色自行车经过海边。画面右下角标注日期 2026-10-31。</desc>
