  <path d="M531 327c-17-10-26 2-18 15 6 11 21 8 22-1Z" fill="#367284" stroke="#294a4a" stroke-width="4"/>
  <path d="M373 389c10-22 35-25 61-15 34 13 51 43 92 51 45 8 93-3 138-19 25-9 46-13 65-11 12 1 17 7 10 12l-17 8c14-2 23-1 23 5 0 8-22 15-40 17-56 6-98 37-157 32-56-4-110-10-147-33-24-15-36-32-28-47Z" fill="#fffdf2" stroke="#294a4a" stroke-width="5" stroke-linejoin="round"/>
