<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" fill="none" role="img" aria-labelledby="title description">
  <title id="title">鹈鹕的海边骑行</title>
  <desc id="description">一只系着蓝色围巾的白色鹈鹕，伸出翅膀扶住车把，两只蹼足踩着踏板，骑着珊瑚红自行车经过海边。它有金黄色的长嘴和柔软的橙色喉囊，身后是浅蓝色的大海和一轮暖阳。</desc>
  <defs>
    <linearGradient id="sky" x1="550" y1="110" x2="550" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e4eee6"/>
      <stop offset="1" stop-color="#d3e7e1"/>
    </linearGradient>
    <linearGradient id="pouch" x1="694" y1="272" x2="736" y2="354" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f9c379"/>
      <stop offset="1" stop-color="#ed996b"/>
    </linearGradient>
    <linearGradient id="feathers" x1="427" y1="326" x2="503" y2="484" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf4"/>
      <stop offset="1" stop-color="#e5e9db"/>
    </linearGradient>
    <clipPath id="landscape">
      <rect x="163" y="96" width="774" height="684" rx="360"/>
    </clipPath>
    <g id="spokes" stroke="#8fa9a2" stroke-width="2" stroke-linecap="round">
      <path d="M0-126V126M-126 0H126"/>
      <path d="M0-126V126M-126 0H126" transform="rotate(22.5)"/>
      <path d="M0-126V126M-126 0H126" transform="rotate(45)"/>
      <path d="M0-126V126M-126 0H126" transform="rotate(67.5)"/>
    </g>
    <g id="wheel">
      <circle r="140" fill="#f9f5e9" fill-opacity=".7" stroke="#294a4a" stroke-width="13"/>
      <circle r="131" stroke="#fff9e8" stroke-width="7"/>
      <circle r="126" stroke="#94aaa1" stroke-width="2"/>
      <use href="#spokes"/>
      <circle r="12" fill="#fff6df" stroke="#294a4a" stroke-width="5"/>
      <circle r="4" fill="#294a4a"/>
    </g>
  </defs>

