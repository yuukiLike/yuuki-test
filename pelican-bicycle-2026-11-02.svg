  <path d="m491 465 48 77 13 151" stroke="#294a4a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m491 465 48 77 13 151" stroke="#efb965" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
